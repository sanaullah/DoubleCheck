openapi: 3.0.3
info:
  title: DoubleCheck API
  version: 0.1.0
  description: |
    Local code-review and modernization REST API. Basic Review works without an
    AI key; Modernize requires an enabled LLM provider, including supported
    keyless local providers such as Ollama or Docker. A remote provider may
    receive bounded, redacted context only after the user acknowledges egress.

    Interactive UI: `/apidocs/`  
    Auto-generated from routes: `/cbswagger/json`  
    Product overview: `readme.md`
servers:
  - url: /
    description: This CommandBox server
tags:
  - name: Health
  - name: Session
  - name: Runs
  - name: CodeGraph
  - name: AI
  - name: Local
  - name: Settings
paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/capabilities:
    get:
      tags: [Health]
      summary: Feature capabilities for the UI
      operationId: getCapabilities
      responses:
        "200":
          description: Capability snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"

  /api/v1/ai/smoke:
    get:
      tags: [AI]
      summary: Smoke-test the configured LLM provider
      operationId: aiSmoke
      responses:
        "200":
          description: Provider reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISmokeResponse"
        "502":
          description: Provider is enabled but unreachable or smoke failed
        "503":
          description: No enabled provider is configured

  /api/v1/session:
    get:
      tags: [Session]
      summary: Local workspace identity
      operationId: getSession
      responses:
        "200":
          description: Session payload

  /api/v1/runs:
    get:
      tags: [Runs]
      summary: List review runs
      operationId: listRuns
      parameters:
        - $ref: "#/components/parameters/projectId"
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Paginated runs
    post:
      tags: [Runs]
      summary: Create a review run
      operationId: createRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
            examples:
              workingTree:
                summary: Working-tree review
                value:
                  projectId: default
                  projectPath: C:/path/to/repo
                  mode: working-tree
                  policy:
                    allowedRoles: [security, correctness]
                  budgets:
                    maxTasks: 4
                    maxTokens: 8000
                    maxTokensPerTask: 3000
              modernization:
                summary: Modernize a CFML repository with local Ollama
                value:
                  projectId: default
                  projectPath: C:/path/to/repo
                  mode: full
                  runKind: modernize
                  modernization:
                    source:
                      engine: lucee
                      version: "5.4"
                    target:
                      runtime: lucee
                      language: cfml
                      layoutProfile: modern
                    database:
                      vendor: mysql
                    schemaPack:
                      sourceKind: none
                    privacy:
                      remoteProvider: false
                      remoteEgressAcknowledged: false
                  budgets:
                    maxTasks: 3
                    maxTokens: 12000
      responses:
        "202":
          description: Run accepted (queued/running)
          headers:
            Location:
              description: URL of the new run
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEnvelope"
        "400":
          description: Validation error
        "422":
          description: Invalid project path or run input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/runs/{id}:
    parameters:
      - $ref: "#/components/parameters/runId"
    get:
      tags: [Runs]
      summary: Get run status (includes result when available)
      operationId: getRun
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Run memento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEnvelope"
        "404":
          description: Not found
    delete:
      tags: [Runs]
      summary: Cancel a run
      operationId: cancelRun
      parameters:
        - $ref: "#/components/parameters/projectId"
      responses:
        "202":
          description: Cancellation requested
        "404":
          description: Not found

  /api/v1/runs/{id}/events:
    get:
      tags: [Runs]
      summary: SSE progress stream
      operationId: streamRunEvents
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          description: text/event-stream of run events
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/runs/{id}/event-log:
    get:
      tags: [Runs]
      summary: Persisted event log (non-SSE)
      operationId: getRunEventLog
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          description: Event array

  /api/v1/runs/{id}/traces:
    get:
      tags: [Runs]
      summary: Specialist observability traces
      operationId: getRunTraces
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          description: Trace payload

  /api/v1/runs/{id}/result:
    get:
      tags: [Runs]
      summary: Final review result (findings, baselines, architecture)
      operationId: getRunResult
      parameters:
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          description: Result payload; Review, Modernize, and CodeGraph use different result shapes selected by runKind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResultEnvelope"
        "404":
          description: Not found

  /api/v1/runs/{id}/export:
    get:
      tags: [Runs]
      summary: Export result as markdown, json, or sarif
      operationId: exportRun
      parameters:
        - $ref: "#/components/parameters/runId"
        - name: format
          in: query
          schema:
            type: string
            enum: [markdown, json, sarif]
            default: markdown
          description: Modernize SARIF contains validation and coverage gates; it does not recast proposals as compiler/security findings.
      responses:
        "200":
          description: Exported document
        "422":
          description: Unsupported export format, or CodeGraph export (code export_unsupported)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              examples:
                exportUnsupported:
                  summary: CodeGraph export not available
                  value:
                    error:
                      code: export_unsupported
                      message: CodeGraph export is not available yet

  /api/v1/runs/{id}/codegraph/subgraph:
    get:
      tags: [CodeGraph]
      summary: Neighbourhood subgraph around a focus file
      operationId: getCodeGraphSubgraph
      parameters:
        - $ref: "#/components/parameters/runId"
        - $ref: "#/components/parameters/projectId"
        - name: focus
          in: query
          required: true
          schema: { type: string }
          description: Repository-relative file path to centre the BFS on
        - name: depth
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 3, default: 3 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 300, default: 300 }
        - name: kinds
          in: query
          required: false
          schema: { type: string }
          description: Comma-separated dependency kinds to include
        - name: include
          in: query
          required: false
          schema: { type: string }
          description: Pass tests (or true/1/yes) to include tests edges
      responses:
        "200":
          description: Bounded neighbourhood subgraph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeGraphSubgraphResponse"
        "404":
          description: Run not found or not a codegraph run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Missing focus or depth/limit out of range
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/runs/{id}/codegraph/narrative:
    post:
      tags: [CodeGraph]
      summary: Retry meaning briefing for a stored CodeGraph snapshot
      operationId: postCodeGraphNarrative
      description: Re-runs the optional LLM narrative against the persisted snapshot without re-indexing. Returns narrative.used false when the provider is off or validation fails.
      parameters:
        - $ref: "#/components/parameters/runId"
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Narrative payload (used may be true or false)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      narrative:
                        type: object
                        additionalProperties: true
        "404":
          description: Run not found or not a codegraph run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/runs/{id}/modernization/items/{itemId}/decision:
    put:
      tags: [Runs]
      summary: Accept or reject a Modernize proposal item
      operationId: decideModernizationItem
      parameters:
        - $ref: "#/components/parameters/runId"
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModernizationDecisionRequest"
      responses:
        "200": { description: Decision saved }
        "404": { description: Run or item not found }
        "409":
          description: Stale proposal fingerprint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Invalid item type, decision, or note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [Runs]
      summary: Clear a Modernize proposal decision
      operationId: clearModernizationItemDecision
      parameters:
        - $ref: "#/components/parameters/runId"
        - name: itemId
          in: path
          required: true
          schema: { type: string }
        - name: itemType
          in: query
          required: false
          schema: { type: string }
        - name: itemFingerprint
          in: query
          required: true
          description: Fingerprint of the immutable item being cleared
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModernizationDecisionClearRequest"
      responses:
        "200": { description: Decision cleared }
        "404": { description: Run or item not found }
        "409":
          description: Stale proposal fingerprint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Invalid item type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/runs/{id}/modernization/phases/{phaseId}/rebuild:
    post:
      tags: [Runs]
      summary: Rebuild one Modernize roadmap phase from legacy evidence
      operationId: rebuildModernizationPhase
      parameters:
        - $ref: "#/components/parameters/runId"
        - name: phaseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModernizationPhaseRebuildRequest"
      responses:
        "200":
          description: Phase rebuilt and merged into the plan
        "400":
          description: Rebuild validation failed or legacy evidence missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Run or phase not found
        "409":
          description: Stale plan fingerprint or concurrent rebuild
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Invalid rebuild request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/runs/{id}/modernization/items/{itemId}/rebuild:
    post:
      tags: [Runs]
      summary: Rebuild a single db-finding or db-transition in isolation (no roadmap phase scope)
      operationId: rebuildModernizationItem
      parameters:
        - $ref: "#/components/parameters/runId"
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModernizationItemRebuildRequest"
      responses:
        "200":
          description: Item rebuilt and merged into the plan
        "400":
          description: Rebuild validation failed or item type unsupported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Run or item not found
        "409":
          description: Stale plan fingerprint or concurrent rebuild
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Invalid rebuild request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/history:
    get:
      tags: [Runs]
      summary: Filtered Review and Modernize history with aggregate execution metrics
      operationId: listReviewHistory
      parameters:
        - $ref: "#/components/parameters/projectId"
        - { name: projectPath, in: query, schema: { type: string } }
        - { name: mode, in: query, schema: { type: string, enum: [working-tree, revision-diff, full] } }
        - { name: status, in: query, schema: { type: string } }
        - { name: runKind, in: query, schema: { type: string, enum: [review, modernize, codegraph] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Historical run summaries, page metadata, and page trends
        "422":
          description: Invalid runKind filter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/history/{id}/comparison:
    get:
      tags: [Runs]
      summary: Finding movement against the prior compatible run
      operationId: compareReviewHistory
      parameters:
        - $ref: "#/components/parameters/runId"
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: New, unchanged, resolved, reopened, and severity movement
        "404":
          description: Run not found
        "422":
          description: Baseline comparison is Review-only; Modernize uses plan decisions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/projects:
    get:
      tags: [Session]
      summary: List local workspace projects
      operationId: listProjects
      responses:
        "200":
          description: Projects

  /api/v1/projects/tree:
    get:
      tags: [Session]
      summary: List reviewable source files under a project path
      description: |
        Read-only file discovery for the /review directory picker. Applies the
        same ignore rules and supported-extension allowlist as a scan, but does
        not read file contents, so a large repository can be browsed quickly.
      operationId: listProjectTree
      parameters:
        - name: projectPath
          in: query
          required: true
          schema: { type: string }
        - name: mode
          in: query
          required: false
          schema: { type: string, enum: [full, working-tree, revision-diff], default: full }
      responses:
        "200":
          description: Discovered files, most-recent scan scope, and truncation flag
        "422":
          description: projectPath is missing or invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/workers:
    get:
      tags: [Local]
      summary: Worker registry
      operationId: listWorkers
      responses:
        "200":
          description: Workers

  /api/v1/quality:
    get:
      tags: [Local]
      summary: Quality / evaluation gate status
      operationId: getQuality
      responses:
        "200":
          description: Gate status

  /api/v1/ai-providers:
    get:
      tags: [Settings]
      summary: List saved AI provider profiles
      operationId: listAIProviders
      responses:
        "200":
          description: Provider profiles (API keys masked to the last 4 characters)
    post:
      tags: [Settings]
      summary: Add an AI provider profile
      description: |
        The first profile ever created for a tenant becomes active automatically.
      operationId: createAIProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIProviderProfileInput"
      responses:
        "201":
          description: Created (API key masked in the response)
        "422":
          description: Validation failed

  /api/v1/ai-providers/{id}:
    get:
      tags: [Settings]
      summary: Get an AI provider profile
      operationId: getAIProvider
      parameters:
        - $ref: "#/components/parameters/providerId"
      responses:
        "200":
          description: Provider profile
        "404":
          description: Not found
    put:
      tags: [Settings]
      summary: Update an AI provider profile
      description: |
        Omitting `apiKey` from the request body leaves the stored key unchanged.
      operationId: updateAIProvider
      parameters:
        - $ref: "#/components/parameters/providerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIProviderProfileInput"
      responses:
        "200":
          description: Updated
        "404":
          description: Not found
        "422":
          description: Validation failed
    delete:
      tags: [Settings]
      summary: Delete an AI provider profile
      description: |
        Deleting the active profile activates another remaining profile, or falls
        back to the environment-configured connection if none remain.
      operationId: deleteAIProvider
      parameters:
        - $ref: "#/components/parameters/providerId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /api/v1/ai-providers/{id}/activate:
    post:
      tags: [Settings]
      summary: Make this provider profile the active connection
      description: |
        Takes effect on the very next AI call - no server restart required.
      operationId: activateAIProvider
      parameters:
        - $ref: "#/components/parameters/providerId"
      responses:
        "200":
          description: Activated
        "404":
          description: Not found

  /api/v1/ai-providers/{id}/smoke:
    post:
      tags: [Settings]
      summary: Smoke-test a saved provider profile
      description: |
        Tests the given saved profile without changing which profile is active.
      operationId: smokeTestAIProvider
      parameters:
        - $ref: "#/components/parameters/providerId"
      responses:
        "200":
          description: Provider reachable
        "404":
          description: Not found
        "502":
          description: Smoke test failed

  /api/v1/app-settings:
    get:
      tags: [Settings]
      summary: Server-wide run-budget defaults and local review preferences
      operationId: getAppSettings
      responses:
        "200":
          description: Effective settings (saved overrides merged with environment defaults)
    put:
      tags: [Settings]
      summary: Update run-budget defaults or local review preferences
      description: |
        Accepts a partial struct of any subset of the supported keys.
      operationId: updateAppSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingsInput"
      responses:
        "200":
          description: Updated effective settings
        "422":
          description: Validation failed

  /cbswagger:
    get:
      tags: [Health]
      summary: Auto-generated OpenAPI document (default format)
      operationId: cbswaggerDefault
      responses:
        "200":
          description: OpenAPI JSON or YAML

  /cbswagger/json:
    get:
      tags: [Health]
      summary: Auto-generated OpenAPI JSON from ColdBox routes
      operationId: cbswaggerJson
      responses:
        "200":
          description: OpenAPI 3 JSON

components:
  parameters:
    runId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    projectId:
      name: projectId
      in: query
      required: false
      schema: { type: string }
    providerId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    AIProviderProfileInput:
      type: object
      required: [name, provider, baseUrl, model]
      properties:
        name: { type: string, maxLength: 120 }
        provider:
          type: string
          enum: [openai, openai-compatible, openrouter, ollama, docker, lmstudio, llamacpp]
        baseUrl: { type: string, format: uri }
        model: { type: string, maxLength: 200 }
        apiKey:
          type: string
          description: Omit on update to leave the stored key unchanged.
        timeoutSeconds: { type: integer, minimum: 1, maximum: 3600, default: 120 }
        contextWindow: { type: integer, minimum: 512, maximum: 2000000, default: 128000 }
        inputUsdPerMillion: { type: number, minimum: 0, default: 0 }
        outputUsdPerMillion: { type: number, minimum: 0, default: 0 }

    AppSettingsInput:
      type: object
      description: Any subset of the run-budget default/ceiling keys, the observability toggle, or local review preferences.
      properties:
        planMaxTasks: { type: integer }
        runDefaultTokenBudget: { type: integer }
        runMaxTokenBudget: { type: integer }
        runDefaultTokensPerTask: { type: integer }
        runMaxTokensPerTask: { type: integer }
        runDefaultDurationMs: { type: integer }
        runMaxDurationMs: { type: integer }
        runDefaultIterationsPerTask: { type: integer }
        runMaxIterationsPerTask: { type: integer }
        runDefaultToolOutputCharacters: { type: integer }
        runMaxToolOutputCharacters: { type: integer }
        runDefaultCostUsd: { type: number }
        runMaxCostUsd: { type: number }
        observabilityEnabled: { type: boolean }
        observabilityPreviewCharacters: { type: integer }
        defaultPreset: { type: string, enum: [quick, balanced, deep] }
        defaultMode: { type: string, enum: [full, working-tree, revision-diff] }

    HealthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status: { type: string, example: ok }
            version: { type: string }
            timestamp: { type: string, format: date-time }
            checks:
              type: object
              additionalProperties:
                type: object
                properties:
                  status: { type: string }

    CapabilitiesResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            apiVersion: { type: string, example: v1 }
            runModes:
              type: array
              items:
                type: string
                enum: [working-tree, revision-diff, full]
            runKinds:
              type: array
              items:
                type: string
                enum: [review, modernize, codegraph]
            aiExecution:
              type: object
              properties:
                enabled: { type: boolean }
                provider: { type: string }
                optional: { type: boolean }
            modernization:
              $ref: "#/components/schemas/ModernizationCapabilities"
            codegraph:
              $ref: "#/components/schemas/CodeGraphCapabilities"

    AISmokeResponse:
      type: object
      properties:
        data:
          type: object
          required: [success, enabled, provider, model, baseHost, durationMs, responseFormat, response, outputCharacters, usage, errorClass, circuit]
          properties:
            success: { type: boolean }
            enabled: { type: boolean }
            provider: { type: string }
            model: { type: string }
            baseHost: { type: string }
            durationMs: { type: integer, minimum: 0 }
            responseFormat: { type: string, enum: [json] }
            response:
              type: object
              additionalProperties: true
            outputCharacters: { type: integer, minimum: 0 }
            usage:
              type: object
              required: [promptTokens, completionTokens, totalTokens, source]
              properties:
                promptTokens: { type: integer, minimum: 0 }
                completionTokens: { type: integer, minimum: 0 }
                totalTokens: { type: integer, minimum: 0 }
                source: { type: string, enum: [estimated-from-characters] }
            errorClass: { type: string }
            circuit:
              type: object
              required: [failures, openUntil, open]
              properties:
                failures: { type: integer, minimum: 0 }
                openUntil: { type: integer, minimum: 0 }
                open: { type: boolean }

    CreateRunRequest:
      type: object
      required: [projectPath]
      properties:
        projectId: { type: string, default: default }
        projectPath:
          type: string
          description: Absolute path to the repository root
        mode:
          type: string
          enum: [working-tree, revision-diff, full]
          default: working-tree
        runKind:
          type: string
          enum: [review, modernize, codegraph]
          default: review
          description: Modernize creates an evidence-backed CFML migration plan and requires an enabled LLM provider.
        baseRevision: { type: string }
        headRevision: { type: string, default: HEAD }
        selectedFiles:
          type: array
          items: { type: string }
          description: Optional repository-relative paths from GET /api/v1/projects/tree. Narrows the scan to this subset; omit to scan everything discovered.
        fast:
          type: boolean
          default: false
          description: Skip crew planning and specialist agents, keeping only deterministic and architecture-graph findings for a low-latency save-triggered review loop.
        policy:
          type: object
          properties:
            reviewGoal:
              type: string
              maxLength: 500
              description: Optional user focus supplied to the specialist crew planner
            allowedRoles:
              type: array
              items: { type: string }
        budgets:
          type: object
          properties:
            maxTasks: { type: integer }
            maxTokens: { type: integer }
            maxTokensPerTask: { type: integer }
            maxDurationMs: { type: integer }
            maxIterationsPerTask: { type: integer }
            maxToolOutputCharacters: { type: integer }
            maxCostUsd: { type: number }
        modernization:
          $ref: "#/components/schemas/ModernizationInput"

    RunEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            status:
              type: string
              enum: [queued, running, succeeded, partial, failed, cancelled]
            currentPhase: { type: string }
            progress: { type: integer }
            message: { type: string }
            mode: { type: string }
            projectPath: { type: string }
            runKind: { type: string, enum: [review, modernize, codegraph], default: review }
            input:
              type: object
              description: Immutable normalized run input; Modernize excludes raw schema attachment text.
              additionalProperties: true
            planState:
              type: string
              enum: [generated, needs-review, accepted, rejected]
            result:
              type: object
              description: Present on show/result when available
              oneOf:
                - $ref: "#/components/schemas/ReviewResult"
                - $ref: "#/components/schemas/ModernizationResult"
              additionalProperties: true

    ModernizationCapabilities:
      type: object
      properties:
        enabled: { type: boolean }
        providerEnabled: { type: boolean }
        localProvider: { type: boolean }
        requiresLlm: { type: boolean, example: true }
        schemaVersion: { type: string, example: modernization-plan-v2 }
        placementContractVersion: { type: string, example: modernization-placement-v1 }
        placementTypes:
          type: array
          items: { type: string, enum: [main-app, coldbox-module, external-service] }
        maxSchemaAttachmentBytes: { type: integer, example: 2097152 }
        maxSampleFiles: { type: integer, example: 40 }
        schemaPackFormats:
          type: array
          items: { type: string }
        targetProfiles:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    CodeGraphCapabilities:
      type: object
      properties:
        enabled: { type: boolean, example: true }
        requiresLlm: { type: boolean, example: false, description: Run succeeds without AI (structure only) }
        meaningRequiresLlm: { type: boolean, example: true, description: Domain/process briefing requires a configured provider }
        schemaVersion: { type: string, example: codegraph-snapshot-v1 }
        narrativeVersion: { type: string, example: codegraph-narrative-v2 }

    CodeGraphSubgraphResponse:
      type: object
      properties:
        data:
          type: object
          required: [focus, depth, truncated, totalNodes, totalEdges, nodes, edges]
          properties:
            focus: { type: string }
            depth: { type: integer, minimum: 1 }
            truncated: { type: boolean }
            totalNodes: { type: integer, minimum: 0 }
            totalEdges: { type: integer, minimum: 0 }
            nodes:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  path: { type: string }
                  depth: { type: integer, minimum: 0 }
            edges:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  sourceFile: { type: string }
                  targetFile: { type: string }
                  kind: { type: string }
                  target: { type: string }
                  line: { type: integer }
                  evidence: { type: string }

    ModernizationDecisionRequest:
      type: object
      required: [itemType, itemFingerprint, decision]
      properties:
        itemType:
          type: string
          enum: [target-unit, unit-link, route-contract, db-finding, db-transition, roadmap-phase, sample, context, extract, placement]
        itemFingerprint: { type: string, minLength: 1 }
        planFingerprint: { type: string, minLength: 1, description: Fingerprint of the immutable plan artifact }
        decision: { type: string, enum: [accepted, rejected] }
        selectedOption: { type: string, enum: [main-app, coldbox-module, external-service] }
        note: { type: string, maxLength: 2000 }

    ModernizationDecisionClearRequest:
      type: object
      required: [itemType, itemFingerprint]
      properties:
        itemType:
          type: string
          enum: [target-unit, unit-link, route-contract, db-finding, db-transition, roadmap-phase, sample, context, extract, placement]
        itemFingerprint: { type: string, minLength: 1 }
        planFingerprint: { type: string, minLength: 1, description: Fingerprint of the immutable plan artifact }

    ModernizationPhaseRebuildRequest:
      type: object
      required: [planFingerprint]
      properties:
        planFingerprint:
          type: string
          minLength: 1
          description: Fingerprint of the immutable plan artifact being rebuilt
        note:
          type: string
          maxLength: 1000
          description: Optional guidance for the slice rebuild agent

    ModernizationItemRebuildRequest:
      type: object
      required: [itemType]
      properties:
        itemType:
          type: string
          enum: [db-finding, db-transition]
          description: Only db-finding and db-transition support standalone item rebuild
        itemFingerprint:
          type: string
          description: Fingerprint of the item being rebuilt, for conflict detection
        planFingerprint:
          type: string
          minLength: 1
          description: Fingerprint of the immutable plan artifact being rebuilt
        note:
          type: string
          maxLength: 1000
          description: Optional guidance for the item rebuild agent

    ModernizationInput:
      type: object
      description: Immutable, normalized Modernize input. Inline schema content is redacted and bounded before persistence.
      properties:
        provider: { type: string }
        execution:
          type: object
          readOnly: true
          description: Effective provider/model identity included in the immutable run fingerprint.
          properties:
            provider: { type: string }
            model: { type: string }
        outcomes:
          type: array
          items: { type: string, maxLength: 500 }
        source:
          type: object
          properties:
            engine: { type: string, enum: [lucee, adobe, adobe-coldfusion, coldfusion, boxlang, unknown] }
            version: { type: string }
            javaVersion: { type: string }
        target:
          type: object
          required: [runtime, language, layoutProfile]
          properties:
            runtime: { type: string, enum: [boxlang, lucee] }
            language: { type: string, enum: [boxlang, cfml] }
            layoutProfile: { type: string, enum: [boxlang, modern, flat] }
            coldboxMajor: { type: string }
            cliMajor: { type: string }
        database:
          type: object
          properties:
            vendor: { type: string }
            version: { type: string }
            schema: { type: string }
            collation: { type: string }
            timezone: { type: string }
        schemaPack:
          type: object
          properties:
            sourceKind: { type: string, enum: [none, inline, inline-ddl, upload, attached-dump, repo-path, migration-folder] }
            format: { type: string, enum: [inline-ddl, structured-json-v1, sql-ddl, migration-folder] }
            relativePath: { type: string }
            inlineContent:
              type: string
              writeOnly: true
              maxLength: 2097152
              description: Local-only attachment text; sanitized before durable persistence.
            contentHash: { type: string }
            packVersion: { type: string }
        privacy:
          type: object
          properties:
            remoteProvider: { type: boolean }
            remoteEgressAcknowledged: { type: boolean }
        samplePolicy:
          type: object
          properties:
            maxFiles: { type: integer, minimum: 1 }
            currentPhasesOnly: { type: boolean }

    ReviewResult:
      type: object
      description: Review result containing evidence-backed findings and optional baseline data.
      additionalProperties: true

    RunResultEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            run:
              type: object
              properties:
                id: { type: string, format: uuid }
                runKind: { type: string, enum: [review, modernize, codegraph] }
            result:
              oneOf:
                - $ref: "#/components/schemas/ReviewResult"
                - $ref: "#/components/schemas/ModernizationResult"
              description: Review findings or Modernize plan result; select by data.run.runKind

    ModernizationResult:
      type: object
      description: Modernize result containing the immutable plan, coverage, validation, decisions, and events.
      properties:
        schemaVersion: { type: string, example: modernization-plan-v2 }
        placementContractVersion: { type: string, example: modernization-placement-v1 }
        placementCoverage: { type: object, additionalProperties: true }
        gateSummary: { type: object, additionalProperties: true }
        planState: { type: string, enum: [generated, needs-review, accepted, rejected] }
        coverage: { type: object, additionalProperties: true }
        validation: { type: object, additionalProperties: true }
        decisions: { type: array, items: { type: object, additionalProperties: true } }
        decisionEvents: { type: array, items: { type: object, additionalProperties: true } }
      additionalProperties: true

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
