title = "DoubleCheck secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Seeded corpus uses an inert fixture credential to verify redaction"
paths = [
  '''resources/evaluation-corpus/v1/cases/core-defects/InsecureRepository\.bx''',
  '''tests/fixtures/review-corpus/v1/cases/core-defects/InsecureRepository\.bx'''
]
regexes = [
  '''seeded-test-key-123456'''
]
