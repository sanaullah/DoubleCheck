<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>DoubleCheck API Docs</title>
	<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css">
	<style>
		body { margin: 0; }
		.topbar { display: none; }
		.ci-banner {
			font-family: sans-serif;
			padding: .75rem 1.25rem;
			border-bottom: 1px solid #e0e0e0;
			background: #fafafa;
			color: #3b4151;
			font-size: .9rem;
		}
		.ci-banner a { color: #3b4151; }
	</style>
</head>
<body>
	<div class="ci-banner">
		<strong>DoubleCheck</strong> —
		Interactive OpenAPI (Swagger UI).
		Spec sources:
		<a href="/api/v1/openapi.json">/api/v1/openapi.json</a> (curated) ·
		<a href="/apidocs/openapi.yaml">YAML</a> ·
		<a href="/cbswagger/json">/cbswagger/json</a> (route auto-gen) ·
		<a href="/">Workspace</a>
	</div>
	<div id="swagger-ui"></div>
	<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
	<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js"></script>
	<script>
		window.onload = function () {
			const params = new URLSearchParams( window.location.search );
			const url = params.get( "url" ) || "/api/v1/openapi.json";
			window.ui = SwaggerUIBundle( {
				url: url,
				dom_id: "#swagger-ui",
				deepLinking: true,
				presets: [ SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset ],
				layout: "StandaloneLayout",
				tryItOutEnabled: true,
				validatorUrl: null
			} );
		};
	</script>
</body>
</html>
